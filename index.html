<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Includiamo il charset: il nostro file conterra' caratteri Unicode, superset di ASCII -->
    <meta charset="utf-8">

    <!-- Forziamo Internet explorer ad usare l'ultimo motore di rendering e non andare
        in compatibility mode: vecchi motori non supportano tutte le proprieta' css -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Adattiamo la vista al 100% dello spazio disponibile su qualsiasi dispositivo
        initial-scale=1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esame PPM</title>

    <!-- Includiamo boostrap css-->
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">-->
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
    <link rel="stylesheet" href="css/esame.css" />



    <!-- Script da CDN per aggiungere funzionalita' HTML5 e CSS3 a IE6-IE8 -->
    <script src="http://cdn.jsdelivr.net/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="http://cdn.jsdelivr.net/respond/1.4.2/respond.min.js"></script>
</head>

<body>


<header class="navbar navbar-light bg-light sticky-top shadow-sm px-3" style="height: 64px;">


    <!--<div class="row>"> -->

    <div class="container-fluid d-flex align-items-center">

        <div class="All-selections-sideBar-container">
            <input type="checkbox" id="menu-switcher" class="d-none">

            <label for="menu-switcher" id="menu-toggle" class="btn nav--leftButton__attributes mb-0" style="cursor: pointer;">
                <i class="bi bi-list menu-icon fs-4"></i> <span class="fw-bold d-none d-md-inline ms-2 text-dark">All Sections</span>
            </label>

            <label for="menu-switcher" class="custom-backdrop"></label>

            <div id="sidebarMenu" class="custom-sidebar">

                <div class="h-100 overflow-auto">

                    <div class="p-3">
                        <div class="mb-3 d-flex justify-content-center">
                            <a href="#" id="mega-subscribe-button" class="btn-custom-herald">
                                <span>Subscribe Now</span>
                            </a>
                        </div>

                        <div class="d-flex align-items-start wheater-container mb-3">
                            <div class="d-flex align-items-start">
                                <a class="lefNav--span__temperature d-flex align-items-start text-decoration-none" href="#" title="Current Weather Conditions" aria-label="Current temperature is 48°F">
                                    <span class="lefNav--span__temperature text-dark">48°F</span>
                                    <i class="bi bi-clouds leftNav--i__bi-clouds fs-3 text-dark ms-1"></i>
                                </a>
                            </div>

                            <div class="date-container ms-3">
                                <div class="dateConatiner__date small">
                                    Friday, April 17th 2026
                                </div>
                                <a href="#" class="e-edition-link text-decoration-none dateConatiner--a__E-Edition fw-bold">
                                    <span>E-Edition</span>
                                </a>
                            </div>
                        </div>

                        <a href="#" class="d-flex align-items-center text-decoration-none text-dark py-2 border-top border-bottom">
                            <i class="bi bi-house-door-fill me-2"></i>
                            <span class="fw-bold">Home Page</span>
                        </a>
                    </div>

                    <div class="list-group-no-border">
                        <a href="#" class="list-group-item list-group-item-action fw-bold py-3 text-dark border-0">News</a>
                        <a href="#" class="list-group-item list-group-item-action fw-bold py-3 text-dark border-0">Opinion</a>
                        <a href="#" class="list-group-item list-group-item-action fw-bold py-3 text-dark border-0">Sports</a>
                    </div>

                </div>
            </div>
        </div>


        <div class="navbar-brand mx-auto fw-bold fs-3" style="font-family: serif;">
            Boston Herald
        </div>


        <div class="d-flex align-items-center gap-2  rightNavBottonsContainer">
            <button class="btn btn-primary btn-sm fw-bold nav--btn__customSize navRightBtn-custom-herald d-none d-sm-block">
                <span>Subscribe</span>
            </button>

            <button class="btn btn-primary btn-sm fw-bold nav--btn__customSize navRightBtn-custom-herald d-none d-sm-block">
                <span>Log in</span>
            </button>
        </div>
    </div>

    <!--</div> -->




</header>



    <!-- Includiamo jQuery necessario al javascript di bootstrap per funzionare.
         Inserendolo nel body si assicura che tutto l'html sia caricato quando si invoca jQuery
    -->
    <script type="text/javascript" src="js/jquery.js"></script>
    <!-- Includiamo boostrap js-->
    <script type="text/javascript" src="js/bootstrap.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
